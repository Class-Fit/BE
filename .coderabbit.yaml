# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit 리뷰와 채팅 답변 언어를 한국어로 설정합니다.
language: "ko-KR"

# CodeRabbit 리뷰의 말투와 피드백 방식을 지정합니다.
tone_instructions: >
  문제의 원인과 실제 영향을 설명하고, 중요도에 따라 피드백해주세요.
  수정 방향과 가능하면 공식 문서를 제시하되 과도한 칭찬이나 사소한 지적은 줄여주세요.

# PR 코드 리뷰 관련 설정입니다.
reviews:
  # 중요한 문제 중심으로 균형 있게 리뷰합니다.
  profile: "chill"

  # 최종 승인과 병합은 개발자가 직접 결정합니다.
  request_changes_workflow: false

  # PR 전체 변경 내용을 요약합니다.
  high_level_summary: true

  # 변경된 파일별 요약을 제공합니다.
  changed_files_summary: true

  # walkthrough 영역을 접힌 상태로 표시합니다.
  collapse_walkthrough: true

  # 코드 변경에 흐름이 있으면 시퀀스 다이어그램을 생성합니다.
  sequence_diagrams: true

  # 사람이 리뷰하는 데 필요한 예상 작업량을 표시합니다.
  estimate_code_review_effort: true

  # 연결된 이슈가 있다면 PR이 요구사항을 충족하는지 평가합니다.
  assess_linked_issues: true

  # 현재 PR과 관련 있을 가능성이 있는 이슈를 표시합니다.
  related_issues: true

  # 현재 PR과 관련 있을 가능성이 있는 과거 PR을 표시합니다.
  related_prs: true

  # 개인 프로젝트이므로 레이블 추천과 자동 적용은 사용하지 않습니다.
  suggested_labels: false
  auto_apply_labels: false

  # 개인 프로젝트이므로 리뷰어 추천과 자동 할당은 사용하지 않습니다.
  suggested_reviewers: false
  auto_assign_reviewers: false

  # PR 요약에 시를 생성하지 않습니다.
  poem: false

  # 리뷰 대상에서 제외할 파일과 디렉터리를 지정합니다.
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/out/**"
    - "!**/.idea/**"
    - "!**/generated/**"
    - "!**/*.min.js"
    - "!**/node_modules/**"

  # 특정 경로 또는 파일 패턴별로 별도 리뷰 기준을 지정합니다.
  path_instructions:
    - path: "src/main/**/*.java"
      instructions: |
        다음 항목을 우선적으로 검토해주세요.
        - 계층별 책임과 의존성 방향
        - 트랜잭션 범위 및 데이터 정합성
        - 예외 처리와 적절한 HTTP 상태 코드
        - 인증·인가 누락과 민감 정보 노출
        - null 처리 및 입력값 검증
        단순 취향 차이나 근거 없는 리팩터링은 지양해주세요.

    - path: "src/test/**/*.java"
      instructions: |
        정상 경로뿐 아니라 실패, 경계값, 권한, 중복 요청,
        트랜잭션 롤백 시나리오가 검증되는지 확인해주세요.
        구현 세부사항보다 외부 동작을 검증하는 테스트를 우선해주세요.

    - path: "**/*Controller.java"
      instructions: |
        요청값 검증, 인증·인가, HTTP 상태 코드, 응답 DTO,
        도메인 객체의 직접 노출 여부를 중점적으로 검토해주세요.
        Controller에 비즈니스 로직이 포함되어 있지 않은지도 확인해주세요.

    - path: "**/*Service.java"
      instructions: |
        비즈니스 규칙이 올바르게 구현되었는지 확인해주세요.
        트랜잭션 범위, 예외 처리, 중복 요청, 동시성 문제와
        Service가 지나치게 많은 책임을 가지고 있지 않은지 검토해주세요.

    - path: "**/*Repository.java"
      instructions: |
        N+1 문제, 페이징 누락, 과도한 데이터 조회,
        불필요한 쿼리와 락 및 동시성 문제를 중점적으로 검토해주세요.
        쿼리 조건에 적절한 인덱스가 필요한지도 확인해주세요.

    - path: "**/*.sql"
      instructions: |
        인덱스, 기본키, 외래키, UNIQUE 및 NOT NULL 제약조건을 검토해주세요.
        기존 데이터가 존재하는 환경에서도 안전하게 실행되는지,
        롤백이나 이전 버전과의 호환성 문제가 없는지 확인해주세요.

  # PR 자동 리뷰 실행 조건입니다.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - "develop"

# PR 댓글 채팅 관련 설정입니다.
chat:
  # 필요할 때 @coderabbitai를 직접 호출하는 방식으로 사용합니다.
  auto_reply: false

# CodeRabbit이 리뷰에 참고할 지식 베이스 설정입니다.
knowledge_base:
  # 필요한 경우 웹 검색으로 최신 공식 문서나 기술 정보를 참고합니다.
  web_search:
    enabled: true

  # AGENTS.md, REVIEW.md 같은 저장소 내 개발 규칙 문서를 리뷰 기준으로 사용합니다.
  code_guidelines:
    enabled: true
