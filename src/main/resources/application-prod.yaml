spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

classfit:
  web:
    frontend-origin: ${CLASSFIT_FRONTEND_ORIGIN}
    login-success-url: ${CLASSFIT_FRONTEND_ORIGIN}/courses

public-data:
  sync:
    enabled: false
