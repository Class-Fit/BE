spring:
  application:
    name: classfit

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

public-data:
  facility-service-key: ${PUBLIC_DATA_FACILITY_SERVICE_KEY:}
  course-service-key: ${PUBLIC_DATA_COURSE_SERVICE_KEY:}
  facility-url: ${PUBLIC_DATA_FACILITY_URL:}
  course-url: ${PUBLIC_DATA_COURSE_URL:}
  gangwon-city-code: "51"
  page-size: 1000
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
