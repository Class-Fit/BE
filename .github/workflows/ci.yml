name: CI

# develop/main 대상 PR과 해당 브랜치의 push에서 실행한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 워크플로·ref에 새 실행이 생기면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      # 현재는 별도 프로필 없이 H2 의존성으로 인메모리 DB가 자동 구성된다.
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
